name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: careerai_dev
          POSTGRES_USER: careerai
          POSTGRES_PASSWORD: careerai_local_dev_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U careerai -d careerai_dev"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      postgres_test:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: careerai_test
          POSTGRES_USER: careerai_test
          POSTGRES_PASSWORD: careerai_test_local_dev_only
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U careerai_test -d careerai_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://careerai:careerai_local_dev_only@localhost:5433/careerai_dev
      TEST_DATABASE_URL: postgresql+psycopg://careerai_test:careerai_test_local_dev_only@localhost:5434/careerai_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run database migrations
        working-directory: ./backend
        run: |
          alembic upgrade head

      - name: Run pytest
        working-directory: ./backend
        run: |
          python -m pytest -q
